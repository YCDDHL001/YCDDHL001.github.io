  <path d="M6 22v6a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-5L6 22z" fill="#ffffff"/>
  <!-- 右侧白色书页 -->
  <path d="M26 22v6a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-5L26 22z" fill="#ffffff"/>

  <!-- 学士帽身 primary.700 -->
  <path d="M11 15v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-7z" fill="#047857"/>
